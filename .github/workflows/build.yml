name: Metal backend
on: [push, pull_request]
jobs:
  metal:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      # Hosted macOS VMs are not guaranteed to expose a Metal GPU.
      - run: ./gradlew clean assemble test --tests '*HostPlatformTest' --tests '*CuprumBackendTest'
      - run: |
          lipo build/generated/metal-native/native/macos-universal/libcuprum_metal.dylib -verify_arch arm64
          lipo build/generated/metal-native/native/macos-universal/libcuprum_metal.dylib -verify_arch x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: cuprum-universal
          path: |
            build/libs/*.jar
            build/reports/tests/test
