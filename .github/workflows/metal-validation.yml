name: Metal GPU validation
on: workflow_dispatch
jobs:
  gpu:
    # Provision this label on a physical Mac with a logged-in graphical session.
    runs-on: [self-hosted, macOS, cuprum-metal]
    env:
      MTL_DEBUG_LAYER: '1'
      METAL_DEVICE_WRAPPER_TYPE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean build nativeSmoke
      - run: CUPRUM_MSL_VERSION=20300 ./gradlew test --rerun-tasks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metal-validation
          path: build/reports/tests/test
